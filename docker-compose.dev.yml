# Development override: hot reload for server and client.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Client: http://localhost:5173   API docs: http://localhost:8000/docs

services:
  server:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      # File change events don't cross Windows/macOS bind mounts reliably
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./server/app:/app/app

  client:
    build:
      context: ./client
      target: dev
    ports: !override
      - "${CLIENT_DEV_PORT:-5173}:5173"
    environment:
      VITE_PROXY_TARGET: http://server:8000
      VITE_USE_POLLING: "true"
    volumes:
      - ./client:/app
      - /app/node_modules
