[pytest]
pythonpath = .
testpaths = tests
# Real-LLM tests spend API quota: opt in with  pytest -m llm
addopts = -m "not llm"
markers =
    e2e: needs the running stack (API_URL)
    llm: calls the real LLM API (needs GEMINI_API_KEY)
# Third-party: Starlette's TestClient deprecates httpx; not our code (tests/test_api.py uses it)
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
